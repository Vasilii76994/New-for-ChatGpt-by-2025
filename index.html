<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-color: #050611;
      --panel-bg: rgba(17, 24, 39, 0.85);
      --accent: #38bdf8;
      --text-color: #e0f2fe;
      --orbit-color: rgba(148, 163, 184, 0.25);
      --sun-glow: #facc15;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #0f172a, var(--bg-color));
      color: var(--text-color);
      overflow: hidden;
    }

    header, footer {
      padding: 1rem 1.5rem;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.25rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem 1.5rem;
      overflow: hidden;
    }

    .canvas-container {
      position: relative;
      flex: 2.2;
      border-radius: 1rem;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.65), rgba(15, 23, 42, 0.9));
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.55);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .controls {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(12px);
      display: grid;
      gap: 0.75rem;
      min-width: 220px;
    }

    .control {
      display: grid;
      gap: 0.35rem;
      font-size: 0.9rem;
    }

    .control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: rgba(226, 232, 240, 0.9);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.35);
      transform: translate(-50%, -125%);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .tooltip.visible {
      opacity: 1;
    }

    .info-panel {
      flex: 1;
      padding: 1.25rem;
      border-radius: 1rem;
      background: var(--panel-bg);
      border: 1px solid rgba(148, 163, 184, 0.12);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 360px;
      backdrop-filter: blur(18px);
    }

    .info-panel h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
    }

    .info-panel p {
      margin: 0;
      line-height: 1.55;
      color: rgba(226, 232, 240, 0.85);
    }

    .planet-meta {
      display: grid;
      gap: 0.25rem;
      font-size: 0.95rem;
    }

    footer {
      font-size: 0.85rem;
      color: rgba(226, 232, 240, 0.55);
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    footer strong {
      color: rgba(248, 250, 252, 0.85);
    }

    @media (max-width: 920px) {
      main {
        flex-direction: column;
      }

      .canvas-container {
        min-height: 360px;
      }

      .info-panel {
        max-width: none;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Solar System Explorer</h1>
  </header>
  <main>
    <div class="canvas-container">
      <canvas id="solarCanvas" aria-label="Interactive solar system visualization"></canvas>
      <div class="controls" aria-live="polite">
        <div class="control">
          <label for="speedControl">Orbit Speed <span id="speedLabel">1.0x</span></label>
          <input id="speedControl" type="range" min="0" max="4" step="0.1" value="1">
        </div>
        <div class="control">
          <label for="zoomControl">Zoom <span id="zoomLabel">1.00×</span></label>
          <input id="zoomControl" type="range" min="0.4" max="2.5" step="0.05" value="1">
        </div>
        <p style="margin:0;font-size:0.8rem;color:rgba(226,232,240,0.6);">
          Drag to rotate • Scroll to zoom • Click planets for details
        </p>
      </div>
      <div id="tooltip" class="tooltip" role="tooltip"></div>
    </div>
    <aside class="info-panel" aria-live="polite">
      <h2 id="planetTitle">Welcome</h2>
      <div class="planet-meta" id="planetMeta"></div>
      <p id="planetDescription">Use the controls and click any planet to learn about its orbit around the Sun.</p>
    </aside>
  </main>
  <footer>
    <strong>Solar System Explorer</strong> &mdash; A playful model of orbital motion. Orbits and scale are illustrative, not to scale.
  </footer>
  <script>
    const canvas = document.getElementById('solarCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const planetTitle = document.getElementById('planetTitle');
    const planetMeta = document.getElementById('planetMeta');
    const planetDescription = document.getElementById('planetDescription');
    const speedControl = document.getElementById('speedControl');
    const speedLabel = document.getElementById('speedLabel');
    const zoomControl = document.getElementById('zoomControl');
    const zoomLabel = document.getElementById('zoomLabel');

    const planets = [
      {
        name: 'Mercury',
        color: '#cbd5f5',
        orbitRadius: 55,
        size: 4,
        orbitalPeriod: 88,
        description: 'The smallest planet and closest to the Sun, Mercury completes an orbit in just 88 Earth days.'
      },
      {
        name: 'Venus',
        color: '#fde68a',
        orbitRadius: 85,
        size: 7,
        orbitalPeriod: 225,
        description: 'Venus is wrapped in thick clouds, shining brightly in our sky and spinning slowly in the opposite direction.'
      },
      {
        name: 'Earth',
        color: '#60a5fa',
        orbitRadius: 115,
        size: 7,
        orbitalPeriod: 365,
        description: 'Our home planet, rich with liquid water and life, circles the Sun once each year with its moon in tow.'
      },
      {
        name: 'Mars',
        color: '#f87171',
        orbitRadius: 145,
        size: 5.5,
        orbitalPeriod: 687,
        description: 'The Red Planet hosts towering volcanoes, deep canyons, and whispers of ancient water flows.'
      },
      {
        name: 'Jupiter',
        color: '#fbbf24',
        orbitRadius: 190,
        size: 13,
        orbitalPeriod: 4331,
        description: 'Jupiter is a gas giant with swirling storms, including the Great Red Spot that has raged for centuries.'
      },
      {
        name: 'Saturn',
        color: '#facc15',
        orbitRadius: 240,
        size: 11,
        orbitalPeriod: 10747,
        description: 'Adorned with brilliant rings of ice and rock, Saturn is a jewel of the outer solar system.'
      },
      {
        name: 'Uranus',
        color: '#38bdf8',
        orbitRadius: 285,
        size: 9,
        orbitalPeriod: 30589,
        description: 'Uranus rotates on its side, rolling around the Sun with a chilly blue-green glow.'
      },
      {
        name: 'Neptune',
        color: '#2563eb',
        orbitRadius: 325,
        size: 9,
        orbitalPeriod: 59800,
        description: 'Neptune is a distant ice giant with supersonic winds and a deep azure hue.'
      }
    ];

    const sun = {
      radius: 18,
      glow: 45
    };

    let timeScale = parseFloat(speedControl.value);
    let zoom = parseFloat(zoomControl.value);
    let rotationAngle = 0;
    let time = 0;
    let lastTimestamp = performance.now();
    let isDragging = false;
    let dragStartX = 0;
    let movedDuringDrag = false;

    function resizeCanvas() {
      const { width, height } = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateSpeedLabel() {
      speedLabel.textContent = `${timeScale.toFixed(1)}x`;
    }

    function updateZoomLabel() {
      zoomLabel.textContent = `${zoom.toFixed(2)}×`;
    }

    speedControl.addEventListener('input', (event) => {
      timeScale = parseFloat(event.target.value);
      updateSpeedLabel();
    });

    zoomControl.addEventListener('input', (event) => {
      zoom = parseFloat(event.target.value);
      updateZoomLabel();
    });

    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      const delta = -Math.sign(event.deltaY) * 0.1;
      zoom = Math.min(2.5, Math.max(0.4, zoom + delta));
      zoomControl.value = zoom.toFixed(2);
      updateZoomLabel();
    }, { passive: false });

    canvas.addEventListener('pointerdown', (event) => {
      canvas.setPointerCapture(event.pointerId);
      isDragging = true;
      dragStartX = event.clientX;
      movedDuringDrag = false;
    });

    canvas.addEventListener('pointermove', (event) => {
      if (isDragging) {
        const deltaX = event.clientX - dragStartX;
        dragStartX = event.clientX;
        rotationAngle += deltaX * 0.01;
        movedDuringDrag = true;
      } else {
        handleHover(event);
      }
    });

    canvas.addEventListener('pointerup', (event) => {
      canvas.releasePointerCapture(event.pointerId);
      if (!movedDuringDrag) {
        handleClick(event);
      }
      isDragging = false;
      movedDuringDrag = false;
    });

    canvas.addEventListener('pointerleave', () => {
      isDragging = false;
      tooltip.classList.remove('visible');
    });

    function canvasToSystem(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      let localX = (x - cx) / zoom;
      let localY = (y - cy) / zoom;
      const cosA = Math.cos(rotationAngle);
      const sinA = Math.sin(rotationAngle);
      const systemX = localX * cosA + localY * sinA;
      const systemY = -localX * sinA + localY * cosA;
      return { x: systemX, y: systemY, canvasX: x, canvasY: y };
    }

    function findPlanetAt(event) {
      const { x, y } = canvasToSystem(event);
      for (const planet of planets) {
        const pos = planet.currentPosition;
        if (!pos) continue;
        const dx = x - pos.x;
        const dy = y - pos.y;
        const distance = Math.hypot(dx, dy);
        if (distance <= (planet.size + 2)) {
          return planet;
        }
      }
      return null;
    }

    function handleClick(event) {
      const planet = findPlanetAt(event);
      if (planet) {
        showPlanetInfo(planet);
      }
    }

    function handleHover(event) {
      const planet = findPlanetAt(event);
      if (planet) {
        tooltip.textContent = planet.name;
        tooltip.style.left = `${canvasToSystem(event).canvasX}px`;
        tooltip.style.top = `${canvasToSystem(event).canvasY}px`;
        tooltip.classList.add('visible');
      } else {
        tooltip.classList.remove('visible');
      }
    }

    function showPlanetInfo(planet) {
      planetTitle.textContent = planet.name;
      planetMeta.innerHTML = `
        <span><strong>Orbital period:</strong> ${planet.orbitalPeriod.toLocaleString()} Earth days</span>
        <span><strong>Average orbit radius:</strong> ${(planet.orbitRadius * 1.5).toFixed(0)} million km (illustrative)</span>
      `;
      planetDescription.textContent = planet.description;
    }

    function drawScene() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(zoom, zoom);
      ctx.rotate(rotationAngle);

      const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, sun.glow);
      gradient.addColorStop(0, 'rgba(250, 204, 21, 0.95)');
      gradient.addColorStop(0.5, 'rgba(251, 191, 36, 0.7)');
      gradient.addColorStop(1, 'rgba(14, 165, 233, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, sun.glow, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = varColor('--sun-glow', '#facc15');
      ctx.beginPath();
      ctx.shadowColor = 'rgba(250, 204, 21, 0.7)';
      ctx.shadowBlur = 25;
      ctx.arc(0, 0, sun.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      for (const planet of planets) {
        ctx.strokeStyle = varColor('--orbit-color', 'rgba(148, 163, 184, 0.25)');
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.arc(0, 0, planet.orbitRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      for (const planet of planets) {
        const orbitSpeed = (Math.PI * 2) / planet.orbitalPeriod;
        const angle = time * orbitSpeed;
        const x = Math.cos(angle) * planet.orbitRadius;
        const y = Math.sin(angle) * planet.orbitRadius;
        planet.currentPosition = { x, y };

        ctx.fillStyle = planet.color;
        ctx.beginPath();
        ctx.arc(x, y, planet.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function varColor(variableName, fallback) {
      return getComputedStyle(document.documentElement).getPropertyValue(variableName) || fallback;
    }

    function animate(now) {
      const deltaSeconds = (now - lastTimestamp) / 1000;
      lastTimestamp = now;
      time += deltaSeconds * (timeScale * 20 + 1);
      drawScene();
      requestAnimationFrame(animate);
    }

    updateSpeedLabel();
    updateZoomLabel();
    requestAnimationFrame((timestamp) => {
      lastTimestamp = timestamp;
      animate(timestamp);
    });
  </script>
</body>
</html>
